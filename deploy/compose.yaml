# Database-only development stack. Add compose.workbench.yaml for the containerized workbench.
services:
  db:
    image: ${SW_PG_IMAGE:-postgres:17}
    environment:
      POSTGRES_DB: stellarweaver
      POSTGRES_USER: stellarweaver_admin
      POSTGRES_PASSWORD: ${SW_PG_ADMIN_PASSWORD:?set SW_PG_ADMIN_PASSWORD}
      SW_PG_APP_PASSWORD: ${SW_PG_APP_PASSWORD:?set SW_PG_APP_PASSWORD}
    ports:
      - "127.0.0.1:${SW_PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarweaver_admin -d stellarweaver"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
