# Local registration and projects. Only loopback ports are published.
x-projects: &projects
  type: bind
  source: ${SW_WORKBENCH_PROJECTS_ROOT:?set SW_WORKBENCH_PROJECTS_ROOT}
  target: /projects
  read_only: true
  bind:
    create_host_path: false

x-local: &local
  SW_WEB_LOCAL_OWNER_ID: ${SW_G5_LOCAL_OWNER_ID:?set SW_G5_LOCAL_OWNER_ID}
  SW_WEB_PROJECTS_ROOT: /projects
  SW_WEB_PROJECTS_HOST_ROOT: ${SW_WORKBENCH_PROJECTS_ROOT:?set SW_WORKBENCH_PROJECTS_ROOT}

services:
  db:
    ports: !override
      - "127.0.0.1:${SW_PG_PORT:-55434}:5432"
  api:
    environment:
      <<: *local
      STELLARWEAVER_WEB_TOKEN: ""
      SW_WEB_AGENT_SKILLS_ROOT: ${SW_WORKBENCH_AGENT_SKILLS_ROOT:+/installed-skills/agents}
      SW_WEB_NESTED_SKILLS_ROOT: ${SW_WORKBENCH_AGENT_SKILLS_ROOT:+/installed-skills/agents/skills-codex}
      SW_WEB_CODEX_SKILLS_ROOT: ${SW_WORKBENCH_CODEX_SKILLS_ROOT:+/installed-skills/codex}
    volumes:
      - *projects
      - type: bind
        source: ${SW_WORKBENCH_AGENT_SKILLS_ROOT:-../docs}
        target: /installed-skills/agents
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SW_WORKBENCH_CODEX_SKILLS_ROOT:-../docs}
        target: /installed-skills/codex
        read_only: true
        bind:
          create_host_path: false
  worker:
    environment: *local
    volumes:
      - *projects
