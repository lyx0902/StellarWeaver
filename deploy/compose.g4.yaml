# Optional G4 overlay; the repository stays read-only in both services.
x-isolation: &isolation
  SW_WEB_RUNNER_IMAGE: ${SW_RUNNER_IMAGE:-python:3.12-slim-bookworm}
  SW_WEB_RUNNER_NAMESPACE: ${COMPOSE_PROJECT_NAME}
  SW_WEB_VERIFY_COMMANDS: '${SW_VERIFY_COMMANDS:-[["python","-m","unittest","-q"]]}'

services:
  api:
    environment: *isolation
  worker:
    image: ${SW_WORKBENCH_WORKER_IMAGE:-stellarweaver-workbench:isolated}
    build:
      target: isolated-worker
    environment: *isolation
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${SW_WORKBENCH_WORKSPACE:?set SW_WORKBENCH_WORKSPACE}
        target: /workspaces/project
        read_only: true
        bind:
          create_host_path: false
