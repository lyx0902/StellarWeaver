# Team overlay for compose.yaml and compose.workbench.yaml.
x-team: &team
  SW_WEB_MEMBERS: /config/members.json
  SW_WEB_RUNNER_IMAGE: ${SW_RUNNER_IMAGE:-python:3.12-slim-bookworm}
  SW_WEB_DEVELOPMENT_TOOLS: ${SW_WEB_DEVELOPMENT_TOOLS:-0}
  SW_WEB_SANDBOX_PROFILE: ${SW_WEB_SANDBOX_PROFILE:-sandbox-workspace}
  SW_WEB_ISSUE_NAVIGATION: ${SW_WEB_ISSUE_NAVIGATION:-0}
  SW_WEB_REPAIR_CONTROLLER: ${SW_WEB_REPAIR_CONTROLLER:-off}
  SW_WEB_PATCH_STAGING: ${SW_WEB_PATCH_STAGING:-0}
  SW_WEB_TASK_EVIDENCE: ${SW_WEB_TASK_EVIDENCE:-0}
  SW_WEB_BUDGET_GUIDANCE: ${SW_WEB_BUDGET_GUIDANCE:-0}
  SW_WEB_PIPELINE_METRICS: ${SW_WEB_PIPELINE_METRICS:-0}
  SW_WEB_MULTI_EDIT_TOOLS: ${SW_WEB_MULTI_EDIT_TOOLS:-0}
  SW_WEB_POST_EDIT_SYNTAX_HOOK: ${SW_WEB_POST_EDIT_SYNTAX_HOOK:-0}
  SW_WEB_SMART_TOOL_TRUNCATION: ${SW_WEB_SMART_TOOL_TRUNCATION:-0}
  SW_WEB_NAVIGATION_PREFILTER: ${SW_WEB_NAVIGATION_PREFILTER:-0}
  SW_WEB_MULTI_FILE_APPLY: ${SW_WEB_MULTI_FILE_APPLY:-0}
  SW_WEB_PARALLEL_READ_TOOLS: ${SW_WEB_PARALLEL_READ_TOOLS:-0}
  SW_WEB_SCOPED_TEST_GRANTS: ${SW_WEB_SCOPED_TEST_GRANTS:-0}
  SW_WEB_INCREMENTAL_SANDBOX_SNAPSHOTS: ${SW_WEB_INCREMENTAL_SANDBOX_SNAPSHOTS:-0}
  SW_WEB_IMPORT_AWARE_REPOMAP: ${SW_WEB_IMPORT_AWARE_REPOMAP:-0}
  SW_WEB_SUBAGENT_EXPLORATION: ${SW_WEB_SUBAGENT_EXPLORATION:-0}
  SW_WEB_EXPLORATION_MAX_MODEL_CALLS: ${SW_WEB_EXPLORATION_MAX_MODEL_CALLS:-20}
  SW_WEB_EXPLORATION_MAX_TOOL_CALLS: ${SW_WEB_EXPLORATION_MAX_TOOL_CALLS:-60}
  SW_WEB_EXPLORATION_TIMEOUT_SECONDS: ${SW_WEB_EXPLORATION_TIMEOUT_SECONDS:-300}
  SW_WEB_EXPLORATION_STALL_ROUNDS: ${SW_WEB_EXPLORATION_STALL_ROUNDS:-3}
  SW_WEB_CALIBRATED_CONTEXT_BUDGET: ${SW_WEB_CALIBRATED_CONTEXT_BUDGET:-0}
  SW_WEB_STICKY_CONTEXT_CHECKPOINT: ${SW_WEB_STICKY_CONTEXT_CHECKPOINT:-0}
  SW_WEB_PROTECT_FRESH_TOOL_OUTPUT: ${SW_WEB_PROTECT_FRESH_TOOL_OUTPUT:-0}
  SW_WEB_FRESH_TOOL_ROUNDS: ${SW_WEB_FRESH_TOOL_ROUNDS:-2}
  SW_WEB_INCLUDE_LINTER: ${SW_WEB_INCLUDE_LINTER:-1}
  SW_WEB_SOFT_TEST_FAILURE_REMINDER: ${SW_WEB_SOFT_TEST_FAILURE_REMINDER:-0}
  SW_WEB_MAX_LENGTH_CONTINUATIONS: ${SW_WEB_MAX_LENGTH_CONTINUATIONS:-0}
  SW_WEB_STREAM_REPETITION_DETECTION: ${SW_WEB_STREAM_REPETITION_DETECTION:-0}
  SW_WEB_REPEATED_FAILURE_SOFT_THRESHOLD: ${SW_WEB_REPEATED_FAILURE_SOFT_THRESHOLD:-3}
  SW_WEB_REPEATED_FAILURE_HARD_THRESHOLD: ${SW_WEB_REPEATED_FAILURE_HARD_THRESHOLD:-3}
  SW_WEB_MAX_RETRIES: ${SW_WEB_MAX_RETRIES:-2}
  SW_WEB_RUNNER_NAMESPACE: ${COMPOSE_PROJECT_NAME}
  SW_WEB_VERIFY_COMMANDS: '${SW_VERIFY_COMMANDS:-[["python","-m","unittest","-q"]]}'

x-members: &members
  type: bind
  source: ${SW_G5_MEMBERS_FILE:?set SW_G5_MEMBERS_FILE}
  target: /config/members.json
  read_only: true
  bind:
    create_host_path: false

services:
  db:
    ports: !reset []
  api:
    environment:
      <<: *team
      STELLARWEAVER_WEB_TOKEN: ""
      SW_WEB_LOCAL_PILOT: "1"
      SW_WEB_ALLOW_TEST_TOKENS: ${SW_G5_ALLOW_TEST_TOKENS:-0}
      SW_WEB_TEST_TOKENS: '${SW_G5_TEST_TOKENS:-}'
      SW_WEB_OIDC_ISSUER: ${SW_G5_OIDC_ISSUER:-}
      SW_WEB_OIDC_ORIGIN: ${SW_G5_OIDC_ORIGIN:-}
      SW_WEB_OIDC_CLIENT_ID: ${SW_G5_OIDC_CLIENT_ID:-}
      SW_WEB_OIDC_CLIENT_SECRET: ${SW_G5_OIDC_CLIENT_SECRET:-}
      SW_WEB_OIDC_LOOPBACK_HTTP: ${SW_G5_OIDC_LOOPBACK_HTTP:-0}
    volumes:
      - *members
  worker:
    environment:
      <<: *team
      SW_WEB_EXECUTOR_URL: http://executor:8766
      SW_WEB_EXECUTOR_TOKEN: ${SW_G5_EXECUTOR_TOKEN:?set SW_G5_EXECUTOR_TOKEN}
      SW_WEB_EXECUTOR_SLOTS: ${SW_G5_EXECUTOR_SLOTS:-2}
    volumes:
      - *members
      - type: bind
        source: ${SW_WORKBENCH_WORKSPACE:?set SW_WORKBENCH_WORKSPACE}
        target: /workspaces/project
        read_only: true
        bind:
          create_host_path: false
    networks: [default, execution]
    depends_on:
      executor:
        condition: service_healthy
    stop_grace_period: 45s
  executor:
    image: ${SW_G5_EXECUTOR_IMAGE:-stellarweaver-workbench:g5-executor}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: isolated-worker
    entrypoint: ["python", "-m", "stellarweaver.web.broker"]
    environment:
      SW_WEB_RUNNER_IMAGE: ${SW_RUNNER_IMAGE:-python:3.12-slim-bookworm}
      SW_WEB_DEVELOPMENT_TOOLS: ${SW_WEB_DEVELOPMENT_TOOLS:-0}
      SW_WEB_SANDBOX_PROFILE: ${SW_WEB_SANDBOX_PROFILE:-sandbox-workspace}
      SW_WEB_RUNNER_NAMESPACE: ${COMPOSE_PROJECT_NAME}
      SW_WEB_VERIFY_COMMANDS: '${SW_VERIFY_COMMANDS:-[["python","-m","unittest","-q"]]}'
      SW_WEB_EXECUTOR_TOKEN: ${SW_G5_EXECUTOR_TOKEN:?set SW_G5_EXECUTOR_TOKEN}
      SW_WEB_EXECUTOR_SLOTS: ${SW_G5_EXECUTOR_SLOTS:-2}
    networks: [execution]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    init: true
    stop_grace_period: 45s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15

networks:
  execution:
    internal: true
