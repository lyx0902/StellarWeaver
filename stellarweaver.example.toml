# Copy to stellarweaver.toml. Default CLI runs use the offline FakeModel.
[model]
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
thinking = "enabled"
reasoning_effort = "high"
api_key_env = "STELLARWEAVER_API_KEY"
# Explicit conservative working limit; this is not a claim about the model's maximum window.
context_window_tokens = 200000
max_output_tokens = 8192
request_timeout_seconds = 90
supports_streaming = true
supports_tools = true

[limits]
max_model_calls = 30
max_tool_calls = 100
max_wall_seconds = 900
max_input_tokens_total = 1000000
max_output_tokens_total = 30000

[execution]
backend = "host"
# Docker is opt-in. Set backend = "docker" and provide a locally cached pinned image ID or digest.
# image = "sha256:<64 hex digits>"
# profile = "sandbox-workspace"
# allow_argv = false
default_timeout_seconds = 60
max_timeout_seconds = 300
max_output_bytes_per_stream = 1048576

[policy]
preset = "ask"

[context]
trigger_ratio = 0.80
target_ratio = 0.55
reserve_tokens = 2048
recent_complete_rounds = 6
fresh_tool_rounds = 2

[retry]
max_retries = 2
base_delay_seconds = 0.5
max_delay_seconds = 30.0

[harness]
development_tools = false
issue_navigation = false
repair_controller = "off"
patch_staging = false
task_evidence = false
budget_guidance = false
pipeline_metrics = false
multi_edit_tools = false
post_edit_syntax_hook = false
smart_tool_truncation = false
navigation_prefilter = false
multi_file_apply = false
parallel_read_tools = false
scoped_test_grants = false
incremental_sandbox_snapshots = false
import_aware_repomap = false
subagent_exploration = false
# Safety limits for delegated exploration when the parent has no run budget.
exploration_max_model_calls = 20
exploration_max_tool_calls = 60
exploration_timeout_seconds = 300
# Consecutive rounds in which all calls repeat or all tools return errors.
exploration_stall_rounds = 3
calibrated_context_budget = false
sticky_context_checkpoint = false
protect_fresh_tool_output = false
